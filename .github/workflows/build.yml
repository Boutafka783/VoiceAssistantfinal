name: Build VoiceAssistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. إنشاء ملفات المشروع
      - name: Generate project files from setup.py
        run: python setup.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # تثبيت أداة ImageMagick لمعالجة الأيقونة
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 2. حقن الأيقونة (يبحث عن أي صورة في المجلد الرئيسي)
      - name: Inject Custom App Icon
        run: |
          ICON_FILE=$(find . -maxdepth 1 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | head -n 1)
          
          if [ -n "$ICON_FILE" ]; then
            echo "🎨 Found image: $ICON_FILE, generating mipmaps..."
            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            
            convert "$ICON_FILE" -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_FILE" -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_FILE" -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_FILE" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_FILE" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            python3 -c "
          path = 'app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: content = f.read()
          if 'android:icon=' not in content:
              content = content.replace('<application', '<application android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher_round\"')
              with open(path, 'w') as f: f.write(content)
          "
            echo "✅ Custom icon applied successfully."
          else
            echo "⚠️ Warning: No image found. Using default icon."
          fi

      # 3. توليد ملفات Gradle Wrapper
      - name: Generate Gradle wrapper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          cd "$RUNNER_TEMP/wrapper-gen"
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-gen/gradlew" "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          chmod +x gradlew

      # 4. فك تشفير ملف التوقيع من الأسرار
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      # 5. التحقق من وجود ملف التوقيع
      - name: Verify Keystore Exists
        run: |
          if [ -f "app/release.jks" ]; then
            echo "✅ Found app/release.jks"
          else
            echo "❌ File app/release.jks NOT found!"
            exit 1
          fi

      # 6. البناء والتوقيع
      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -nE "^e: |error:|What went wrong|OutOfMemory|Java heap|GC overhead|Execution failed|Caused by" build.log | head -60 || true

      # 7. رفع التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zevorix-Release-APK
          path: app/build/outputs/apk/release/*.apk
