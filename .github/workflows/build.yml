name: Build VoiceAssistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project files from setup.py
        run: python setup.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Create google-services.json
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Force Inject Custom App Icon
        run: |
          echo "=========================================="
          echo "🔍 Starting Custom Icon Injection Process..."
          echo "=========================================="
          
          if [ -f "icon.jpg" ]; then
            echo "✅ SUCCESS: icon.jpg found in root directory!"
            
            # إنشاء كافة مجلدات الـ mipmap الإلزامية للتأكد من وجودها
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "app/src/main/res/mipmap-$d"
            done
            
            echo "🎨 Converting and resizing icon.jpg to all mipmap densities..."
            convert "icon.jpg" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "icon.jpg" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "icon.jpg" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "icon.jpg" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "icon.jpg" -resize 192x192 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert "icon.jpg" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp "app/src/main/res/mipmap-$d/ic_launcher.png" "app/src/main/res/mipmap-$d/ic_launcher_round.png" 2>/dev/null || true
            done
            
            echo "📋 Checking AndroidManifest.xml for icon configuration..."
            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              if grep -q 'android:icon=' app/src/main/AndroidManifest.xml; then
                echo "ℹ️ android:icon already exists in Manifest, updating it..."
                sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' app/src/main/AndroidManifest.xml
                sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              else
                echo "➕ Adding android:icon and android:roundIcon to application tag..."
                sed -i '0,/<application/s|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
              fi
              echo "✅ AndroidManifest.xml successfully updated with custom icons!"
            else
              echo "❌ ERROR: AndroidManifest.xml not found!"
              exit 1
            fi
            echo "=========================================="
            echo "🎉 Icon injection completed successfully!"
            echo "=========================================="
          else
            echo "❌ CRITICAL ERROR: icon.jpg NOT found in root directory! Default icon will be used."
            exit 1
          fi

      - name: Generate Gradle wrapper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          cd "$RUNNER_TEMP/wrapper-gen"
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-gen/gradlew" "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          chmod +x gradlew

      - name: Decode Keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Verify Keystore Exists
        run: |
          if [ -s "app/release.jks" ]; then
            echo "✅ Found app/release.jks"
          else
            echo "❌ File app/release.jks NOT found or empty!"
            exit 1
          fi

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -nE "^e: |error:|What went wrong|OutOfMemory|Java heap|GC overhead|Execution failed|Caused by" build.log | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zevorix-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
