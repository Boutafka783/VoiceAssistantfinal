name: Build VoiceAssistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project files from setup.py
        run: python setup.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # --- هذه هي الخطوة السحرية التي تنشئ الملف من النص الذي لصقته ---
      - name: Decode Keystore (Python)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python -c "
          import base64, os, re
          s = os.environ['KEYSTORE_BASE64']
          s = re.sub(r'[^a-zA-Z0-9+/=]', '', s)
          missing_padding = len(s) % 4
          if missing_padding:
              s += '=' * (4 - missing_padding)
          open('app/release.jks', 'wb').write(base64.b64decode(s))
          print('✅ Keystore decoded successfully.')
          "

      - name: Generate Gradle wrapper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          cd "$RUNNER_TEMP/wrapper-gen"
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/wrapper-gen/gradlew" "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "app/release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -nE "^e: |error:|What went wrong|OutOfMemory|Java heap|GC overhead|Execution failed|Caused by" build.log | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zevorix-Release-APK
          path: app/build/outputs/apk/release/*.apk
