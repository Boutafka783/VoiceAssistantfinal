name: Build VoiceAssistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. إنشاء ملفات المشروع
      - name: Generate project files from setup.py
        run: python setup.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Create google-services.json
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # تثبيت أداة ImageMagick لمعالجة الأيقونة
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 2. حقن الأيقونة (نسخة محسنة ومضمونة 100%)
      - name: Inject Custom App Icon
        run: |
          ICON_FILE=$(find . -maxdepth 1 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | head -n 1)

          if [ -n "$ICON_FILE" ]; then
            echo "🎨 Found image: $ICON_FILE"
            
            # نسخ الصورة لاسم آمن
            cp "$ICON_FILE" /tmp/app_icon.img
            
            # 1. حذف كل الأيقونات القديمة (بما فيها التكيفية) لإجبار النظام على استخدام صورتنا
            rm -rf app/src/main/res/mipmap-anydpi-v26
            rm -rf app/src/main/res/drawable/ic_launcher_background.xml
            rm -rf app/src/main/res/drawable/ic_launcher_foreground.xml
            find app/src/main/res -name "ic_launcher*" -delete

            # 2. إنشاء المجلدات
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "app/src/main/res/mipmap-$d"
            done

            # 3. قص الصورة وجعلها مربعة تماماً
            convert /tmp/app_icon.img -background none -gravity center -resize 48x48^ -extent 48x48     app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert /tmp/app_icon.img -background none -gravity center -resize 72x72^ -extent 72x72     app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert /tmp/app_icon.img -background none -gravity center -resize 96x96^ -extent 96x96     app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert /tmp/app_icon.img -background none -gravity center -resize 144x144^ -extent 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert /tmp/app_icon.img -background none -gravity center -resize 192x192^ -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            # 4. إنشاء الأيقونة الدائرية
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp "app/src/main/res/mipmap-$d/ic_launcher.png" "app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done

            # 5. إجبار المانيفست على استخدام الأيقونة الجديدة
            sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|g' app/src/main/AndroidManifest.xml
            sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml

            if ! grep -q 'android:icon=' app/src/main/AndroidManifest.xml; then
              sed -i '0,/<application/s|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
            fi

            echo "✅ Custom icon applied successfully. Verifying manifest:"
            grep 'android:icon' app/src/main/AndroidManifest.xml || true
          else
            echo "⚠️ Warning: No image found. Using default icon."
          fi

      # 3. إضافة مختبر الإلكترونيات
      - name: Apply Circuit Lab patch
        run: |
          if [ -f "circuit_patch.py" ]; then
            python circuit_patch.py
          else
            echo "❌ ERROR: circuit_patch.py not found!"
            exit 1
          fi

      # 4. توليد ملفات Gradle Wrapper
      - name: Generate Gradle wrapper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          cd "$RUNNER_TEMP/wrapper-gen"
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-gen/gradlew" "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          chmod +x gradlew

      # 5. فك تشفير ملف التوقيع
      - name: Decode Keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 6. التحقق من وجود ملف التوقيع
      - name: Verify Keystore Exists
        run: |
          if [ -s "app/release.jks" ]; then
            echo "✅ Found app/release.jks"
          else
            echo "❌ File app/release.jks NOT found or empty!"
            exit 1
          fi

      # 7. البناء والتوقيع
      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Show build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -nE "^e: |error:|What went wrong|OutOfMemory|Java heap|GC overhead|Execution failed|Caused by" build.log | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 8. رفع التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zevorix-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error