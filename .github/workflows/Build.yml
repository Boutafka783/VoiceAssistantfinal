name: Build VoiceAssistant APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project files
        run: python setup.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Create google-services.json
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # 🚨 سكربت الأيقونة (يدعم JPG ويطبع السجلات) 🚨
      - name: Inject Custom App Icon
        run: |
          echo "🔍 Searching for image..."
          # البحث في المجلد الرئيسي فقط
          ICON_FILE=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)

          if [ -z "$ICON_FILE" ]; then
            echo "❌ ERROR: No .jpg or .png image found in the root folder!"
            exit 1
          fi
          
          echo "✅ Found image: $ICON_FILE"
          
          # 1. تحويل الصورة إلى PNG صافي (يتخلص من أي مشاكل في صيغة JPG)
          convert "$ICON_FILE" -background none -alpha remove -alpha off /tmp/master_icon.png
          echo "✅ Converted to PNG."
          
          # 2. مسح كل مجلدات الأيقونات القديمة (تدمير شامل)
          rm -rf app/src/main/res/mipmap-*
          rm -f app/src/main/res/drawable/ic_launcher*
          
          # 3. إنشاء المجلدات
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
          done
          
          # 4. توليد الصور
          convert /tmp/master_icon.png -resize 48x48^ -gravity center -extent 48x48     app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/master_icon.png -resize 72x72^ -gravity center -extent 72x72     app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/master_icon.png -resize 96x96^ -gravity center -extent 96x96     app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/master_icon.png -resize 144x144^ -gravity center -extent 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/master_icon.png -resize 192x192^ -gravity center -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # نسخ الصورة لتعمل كأيقونة دائرية أيضاً
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "app/src/main/res/mipmap-$d/ic_launcher.png" "app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
          
          echo "✅ PNGs generated successfully. Checking files:"
          ls -la app/src/main/res/mipmap-xxxhdpi/

          # 5. تعديل المانيفست بالقوة
          # حذف أي سطر قديم للأيقونة
          sed -i '/android:icon=/d' app/src/main/AndroidManifest.xml
          sed -i '/android:roundIcon=/d' app/src/main/AndroidManifest.xml
          
          # إضافة السطر الجديد داخل وسم <application>
          sed -i '0,/<application/s|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
          
          echo "✅ Manifest updated. Current application tag:"
          grep -o '<application[^>]*>' app/src/main/AndroidManifest.xml

      - name: Apply Circuit Lab patch
        run: python circuit_patch.py

      - name: Generate Gradle wrapper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          cd "$RUNNER_TEMP/wrapper-gen"
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-gen/gradlew" "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          chmod +x gradlew

      - name: Decode Keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zevorix-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error