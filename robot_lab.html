<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ورشة تصنيع الروبوتات</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f18;color:#e8edf5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit}
button{touch-action:manipulation}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;overflow:hidden;overflow:clip}
#scene{overflow:hidden;overflow:clip}
#tabs{flex:0 0 auto;height:2.7rem;display:flex;gap:.3rem;padding:.3rem .5rem;background:#0d1522;border-bottom:1px solid rgba(53,208,255,.4)}
#tabs button{flex:1;border-radius:.6rem;border:1px solid rgba(53,208,255,.35);background:transparent;color:#9fe8ff;font-size:.95rem;font-weight:800}
#tabs button.on{background:rgba(53,208,255,.2);color:#fff;border-color:#35d0ff}
#codePg{display:none;position:absolute;left:0;right:0;top:2.7rem;bottom:0;z-index:30;flex-direction:column;gap:.4rem;padding:.5rem;background:#0a0f18}
#app.cp #codePg{display:flex}
#code{flex:1 1 40%;min-height:6rem;width:100%;resize:none;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5;background:#060a12;color:#cfe9ff;border:1px solid rgba(53,208,255,.4);border-radius:.7rem;padding:.5rem;user-select:text;-webkit-user-select:text;white-space:pre;overflow:auto}
.cb{display:flex;gap:.35rem;flex-wrap:wrap}.cb button,.cb label{flex:1;min-width:30%;text-align:center;padding:.5rem;border-radius:.7rem;border:1px solid rgba(53,208,255,.45);background:rgba(53,208,255,.1);color:#e8edf5;font-size:.88rem;font-weight:700}
#log{flex:1 1 40%;overflow-y:auto;font-size:.85rem;line-height:1.55;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:.7rem;padding:.4rem .5rem;user-select:text;-webkit-user-select:text}
.le{color:#ff9a96}.lw{color:#ffd08a}.lo{color:#7dffb0}.l1{color:#9fb4cc;margin-top:.3rem}
#scene{position:relative;flex:1 1 auto;min-height:0}
#stage{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:.6rem;left:.6rem;right:.6rem;pointer-events:none}
#prog{position:relative;height:1.7rem;border-radius:.9rem;background:rgba(10,15,24,.8);border:1px solid rgba(53,208,255,.45);overflow:hidden}
#bar{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,#35d0ff,#2ecc71);transition:width .4s}
#pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
#toast{position:absolute;top:2.9rem;left:3.2rem;right:3.2rem;text-align:center;background:rgba(10,15,24,.92);border:1px solid rgba(255,159,28,.55);color:#ffd9a0;padding:.45rem .7rem;border-radius:.8rem;font-size:.95rem;line-height:1.5;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.hd{position:absolute;top:38%;z-index:6;padding:.7rem .35rem;border:1px solid #35d0ff;background:rgba(10,15,24,.85);color:#9fe8ff;font-size:.95rem;font-weight:800;writing-mode:vertical-rl;line-height:1}
#scene:not(.man) .hd,#app:not(.man) .dr{display:none}
#mode{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:1.2rem;background:rgba(10,15,24,.82);text-align:center}
#mode h2{margin:0 0 .3rem;font-size:1.25rem;color:#9fe8ff}
#mode button{width:min(100%,17rem);padding:.9rem 1rem;border-radius:.9rem;border:1px solid #35d0ff;background:rgba(53,208,255,.12);color:#e8edf5;font-size:1.05rem;font-weight:800}
#mode button.pri{background:#ff9f1c;border-color:#ffc266;color:#1a1100}
#mode small{display:block;margin-top:.15rem;font-size:.8rem;font-weight:500;opacity:.8}
#bL{left:0;border-radius:0 .8rem .8rem 0}#bR{right:0;border-radius:.8rem 0 0 .8rem}
.hd.nx::after{content:" ●";color:#ff9f1c}
#ctrl{position:absolute;bottom:.6rem;left:0;right:0;display:flex;justify-content:center}
#ctrl button{padding:.7rem 1.1rem;border-radius:.8rem;border:1px solid #ffc266;background:#ff9f1c;color:#1a1100;font-size:1.05rem;font-weight:800;display:none}
#ctrl button.on{background:#e5484d;color:#fff;border-color:#ff8a8d}
.dr{position:absolute;top:2.7rem;bottom:0;z-index:20;width:min(80vw,19rem);display:flex;flex-direction:column;background:rgba(9,14,24,.97);border:1px solid #35d0ff;box-shadow:0 0 24px rgba(53,208,255,.25);transition:transform .25s}
#dl{left:0;transform:translateX(-105%);border-radius:0 1rem 1rem 0}#dr{right:0;transform:translateX(105%);border-radius:1rem 0 0 1rem}
#dl.open,#dr.open,.dr.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;font-size:1.05rem;font-weight:800;color:#9fe8ff;border-bottom:1px solid rgba(53,208,255,.3)}
.dh button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:50%;width:1.7rem;height:1.7rem}
.db{flex:1;overflow-y:auto;padding:.4rem .5rem 1rem}
.gp>button{width:100%;text-align:start;padding:.55rem .6rem;margin-top:.35rem;border:1px solid rgba(53,208,255,.3);border-radius:.7rem;background:rgba(53,208,255,.08);color:#e8edf5;font-size:.95rem;font-weight:800;display:flex;justify-content:space-between}
.gp>button::after{content:"▾";color:#35d0ff}.gp.open>button::after{content:"▴"}
.gp .li{display:none;padding:.2rem 0}.gp.open .li{display:block}
.it{display:flex;gap:.5rem;align-items:center;padding:.45rem .5rem;margin:.25rem 0;border-radius:.7rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);touch-action:pan-y}
.it.nx{border-color:#ff9f1c;box-shadow:0 0 10px rgba(255,159,28,.5)}
.it.on{border-color:#2ecc71;background:rgba(46,204,113,.1)}
.it.lock{opacity:.45}
.it .ic{font-size:1.5rem;width:1.9rem;text-align:center}
.it b{display:block;font-size:.9rem}.it small{display:block;color:#8fa1bb;font-size:.78rem;line-height:1.35}
.it em{font-style:normal;color:#9fe8ff;font-size:.78rem}
#bot{flex:0 0 auto;max-height:42%;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;padding:.5rem .7rem .6rem;background:linear-gradient(180deg,rgba(20,30,50,.8),rgba(8,12,22,.97));border-top:1px solid #35d0ff}
#hint{font-size:.95rem;line-height:1.5;color:#9fe8ff;background:rgba(53,208,255,.08);border:1px solid rgba(53,208,255,.35);border-radius:.7rem;padding:.4rem .6rem}
#warn{display:none;font-size:.88rem;line-height:1.55;color:#ffb4a8;background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.5);border-radius:.7rem;padding:.4rem .6rem}
.ask{display:flex;gap:.4rem}
.ask input{flex:1;min-width:0;border-radius:.7rem;border:1px solid rgba(53,208,255,.4);background:rgba(0,0,0,.3);color:#fff;padding:.45rem .6rem;font-size:.95rem;user-select:text;-webkit-user-select:text}
.ask button,.tb button{padding:.5rem .6rem;border-radius:.7rem;border:1px solid rgba(53,208,255,.45);background:rgba(53,208,255,.1);color:#e8edf5;font-size:.9rem;font-weight:700}
#ans{font-size:.9rem;line-height:1.6;color:#ffd9a0}
.tb{display:flex;gap:.4rem}.tb button{flex:1}
#fly{position:fixed;display:none;z-index:40;pointer-events:none;font-size:2.8rem;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #35d0ff)}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;color:#ff8a8d;line-height:1.7}
#loading{position:fixed;inset:0;z-index:50;background:#0a0f18;display:flex;align-items:center;justify-content:center;transition:opacity .4s;color:#9fe8ff;font-size:1.2rem}
</style>
</head>
<body>
<div id="loading">جاري تجهيز الورشة…</div>
<div id="app">
  <div id="tabs"><button id="tBuild" class="on">🔧 التركيب</button><button id="tCode">💻 البرمجة</button></div>
  <div id="scene">
    <canvas id="stage"></canvas>
    <div id="top"><div id="prog"><div id="bar"></div><div id="pt"></div></div></div>
    <div id="toast"></div>
    <button class="hd" id="bL">📦 القطع</button><button class="hd" id="bR">🦴 الهياكل</button>
    <div id="ctrl"><button id="bRun">▶ تشغيل الروبوت</button></div>
    <div id="mode"><h2>كيف تريد تركيب الروبوت؟</h2><button class="pri" id="mSelf">🛠 أركّب بنفسي<small>تظهر القطع في اللوائح الجانبية</small></button><button id="mWatch">👀 شاهد التركيب<small>عرض تلقائي خطوة بخطوة</small></button></div>
  </div>
  <div id="bot">
    <div id="hint"></div><div id="warn"></div>
    <div class="ask"><input id="q" placeholder="اسأل المساعد: لماذا يحترق السيرفو؟"><button id="bAsk">اسأل</button><button id="bMic" aria-label="تحدث">🎤</button></div>
    <div id="ans"></div>
    <div class="tb"><button id="bUndo">↩ تراجع</button><button id="bSelf">🛠 أركّب بنفسي</button><button id="bDemo">👀 شاهد التركيب</button><button id="bClear">🗑 فك الكل</button></div>
  </div>
  <div id="codePg"><textarea id="code" spellcheck="false" placeholder="اكتب برنامج الروبوت هنا أو ارفع ملفاً…"></textarea>
    <div class="cb"><label for="fIn">📂 رفع ملف</label><input type="file" id="fIn" accept=".txt,.ino,.c,.cpp,.h,.py,.js,text/*" hidden><button id="cEx">📋 مثال</button><button id="cChk">🧪 فحص</button><button id="cRun">▶ شغّل</button></div>
    <div id="log"><div class="l1">الأوامر: walk(خطوات) · turn(درجات) · wave() · nod() · look() · talk("نص") · listen() · led("red") · delay(ms) · sleep(s)<br>لا يعمل الروبوت إلا إذا اكتمل التركيب وسلم الكود، والفيزياء (الوزن والعزم والاتزان) تحدد هل يمشي أو يسقط.</div></div></div>
  <div class="dr" id="dl"><div class="dh"><span>📦 قطع الروبوت</span><button data-c="1">✕</button></div><div class="db" id="dlb"></div></div>
  <div class="dr" id="dr"><div class="dh"><span>🦴 الهياكل</span><button data-c="1">✕</button></div><div class="db" id="drb"></div></div>
</div>
<div id="fly"></div>
<script src="three.min.js"></script>
